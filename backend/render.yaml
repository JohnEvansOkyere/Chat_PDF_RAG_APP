services:
  - type: web
    name: vexaai-rag-backend
    env: python
    plan: free
    region: oregon
    rootDir: Chat_PDF_RAG_APP/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65 --workers 1
    healthCheckPath: /api/health  # Keep this as /api/health since that's your main health endpoint
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-english-v3.0
      - key: CORS_ORIGINS
        value: "https://chat-pdf-rag-app-ugde-82wymx7kx-john-evans-okyeres-projects.vercel.app,http://localhost:3000"